<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 16px;
    color: #222;
    background: #fafafa;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
  }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  h2 { font-size: 1.1rem; margin: 0 0 8px; }
  h3 { font-size: 1rem; margin: 0 0 4px; }

  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid #ddd;
    margin-bottom: 16px;
  }
  .tab-button {
    padding: 8px 16px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 0.95rem;
    border-bottom: 2px solid transparent;
  }
  .tab-button.active {
    border-bottom-color: #2c6e49;
    font-weight: 600;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .day-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .day-nav button {
    padding: 6px 12px;
    cursor: pointer;
  }
  .day-nav button:disabled { opacity: 0.3; cursor: default; }

  .restaurant-card {
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 12px;
  }
  .restaurant-card .meta { color: #666; font-size: 0.85rem; margin-bottom: 8px; }
  .menu-item { display: flex; justify-content: space-between; padding: 4px 0; }
  .menu-item.favourite { background: #fff3a0; font-weight: 600; padding: 4px 6px; border-radius: 4px; }
  .menu-item .price { color: #444; white-space: nowrap; margin-left: 12px; }

  table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
  input[type="text"], input[type="url"] {
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 0.9rem;
  }
  button.primary {
    background: #2c6e49;
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
  }
  button.danger {
    background: none;
    border: 1px solid #c0392b;
    color: #c0392b;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  .status-line { font-size: 0.85rem; color: #666; margin-top: 8px; }
  .danger-text { color: #c0392b; font-weight: 600; }
  footer.version {
    text-align: center;
    color: #aaa;
    font-size: 0.75rem;
    margin-top: 32px;
  }
  .empty-state { color: #888; padding: 24px; text-align: center; }
</style>
